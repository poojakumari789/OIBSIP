<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="converter">
        <div class="icon">🌡️</div>

        <p class="tagline">SIMPLE • FAST • ACCURATE</p>
        <h1>Temperature Converter</h1>
        <p class="subtitle">
            Convert temperatures between Celsius,
            Fahrenheit and Kelvin.
        </p>

        <form id="converterForm">
            <label for="temperature">Enter Temperature</label>
            <input
                type="number"
                id="temperature"
                placeholder="e.g. 25"
                step="any"
                required
            >

            <label for="unit">Convert From</label>
            <select id="unit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <button type="submit" class="convert-btn">
                Convert Temperature
            </button>
            <button type="button" id="clearBtn" class="clear-btn">
                Clear
            </button>
        </form>

        <p id="error" class="error" role="alert"></p>

        <section id="results" class="results" aria-live="polite" hidden>
            <h2>Conversion Results</h2>

            <div class="result-card">
                <span>Celsius</span>
                <strong id="celsiusResult">—</strong>
            </div>

            <div class="result-card">
                <span>Fahrenheit</span>
                <strong id="fahrenheitResult">—</strong>
            </div>

            <div class="result-card">
                <span>Kelvin</span>
                <strong id="kelvinResult">—</strong>
            </div>
        </section>

        <footer>
            <p>Made with ♥ using HTML, CSS & JavaScript</p>
        </footer>
    </main>

</body>
</html>
